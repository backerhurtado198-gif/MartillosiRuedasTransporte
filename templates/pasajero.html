<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Mototaxi - Martillos & Ruedas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h3 class="text-center mb-4 text-primary">🏍️ Martillos & Ruedas</h3>
                    
                    <!-- Aviso de estado del GPS en tiempo real -->
                    <div id="gps-status" class="alert alert-warning text-center py-2 mb-3" style="font-size: 14px;">
                        📍 Solicitando permiso de GPS...
                    </div>

                    <form action="/pedir_carrera" method="POST" id="form-carrera">
                        <input type="hidden" name="latitud_origen" id="latitud_origen">
                        <input type="hidden" name="longitud_origen" id="longitud_origen">

                        <div class="mb-3">
                            <label for="destino" class="form-label"><b>¿A dónde quieres ir?</b></label>
                            <input type="text" class="form-control" name="destino" id="destino" placeholder="Ej: San Juan Centro, Plaza Bolívar" required>
                        </div>

                        <div class="mb-3">
                            <label for="referencia" class="form-label"><b>Punto de referencia / Notas (Opcional)</b></label>
                            <input type="text" class="form-control" name="referencia" id="referencia" placeholder="Ej: Frente a la panadería, portón negro">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2" id="btn-solicitar">Solicitar Mototaxi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
    const form = document.getElementById('form-carrera');
    const statusDiv = document.getElementById('gps-status');
    const btnSolicitar = document.getElementById('btn-solicitar');

    function obtenerGPS(callback) {
        if (!navigator.geolocation) {
            statusDiv.className = "alert alert-danger text-center py-2 mb-3";
            statusDiv.innerHTML = "❌ Tu navegador no soporta GPS.";
            if (callback) callback();
            return;
        }

        statusDiv.className = "alert alert-warning text-center py-2 mb-3";
        statusDiv.innerHTML = "📍 Obteniendo ubicación exacta por GPS...";

        navigator.geolocation.getCurrentPosition(
            function(position) {
                document.getElementById('latitud_origen').value = position.coords.latitude;
                document.getElementById('longitud_origen').value = position.coords.longitude;
                statusDiv.className = "alert alert-success text-center py-2 mb-3";
                statusDiv.innerHTML = "✅ ¡GPS conectado! Ubicación lista para el chofer.";
                if (callback) callback();
            },
            function(error) {
                statusDiv.className = "alert alert-danger text-center py-2 mb-3";
                statusDiv.innerHTML = "⚠️ Activa el GPS de tu teléfono para continuar.";
                btnSolicitar.disabled = false;
                btnSolicitar.innerHTML = "Solicitar Mototaxi";
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    // Pedir GPS al abrir la página
    window.addEventListener('DOMContentLoaded', function() {
        obtenerGPS();
    });

    // Forzar lectura del GPS al hacer clic en solicitar
    form.addEventListener('submit', function(e) {
        const lat = document.getElementById('latitud_origen').value;
        const lng = document.getElementById('longitud_origen').value;

        if (!lat || !lng) {
            e.preventDefault();
            btnSolicitar.disabled = true;
            btnSolicitar.innerHTML = "Obteniendo GPS...";
            obtenerGPS(function() {
                form.submit();
            });
        }
    });
    </script>
</body>
</html>
