<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Mototaxi - Martillos & Ruedas</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }
        h3 {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 20px;
        }
        .mb-3 {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus {
            border-color: #0d6efd;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0b5ed7;
        }
        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .alert-success { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="card">
        <h3>🏍️ Martillos & Ruedas</h3>
        
        <div id="gps-status" class="alert alert-warning">
            📍 Solicitando permiso de GPS...
        </div>

        <form action="/pedir_carrera" method="POST" id="form-carrera">
            <input type="hidden" name="latitud_origen" id="latitud_origen">
            <input type="hidden" name="longitud_origen" id="longitud_origen">

            <div class="mb-3">
                <label for="destino">¿A dónde quieres ir?</label>
                <input type="text" name="destino" id="destino" placeholder="Ej: San Juan Centro, Plaza Bolívar" required>
            </div>

            <div class="mb-3">
                <label for="referencia">Punto de referencia / Notas (Opcional)</label>
                <input type="text" name="referencia" id="referencia" placeholder="Ej: Frente a la panadería, portón negro">
            </div>

            <button type="submit" class="btn" id="btn-solicitar">Solicitar Mototaxi</button>
        </form>
    </div>

    <script>
    const form = document.getElementById('form-carrera');
    const statusDiv = document.getElementById('gps-status');
    const btnSolicitar = document.getElementById('btn-solicitar');

    function obtenerGPS(callback) {
        if (!navigator.geolocation) {
            statusDiv.className = "alert alert-danger";
            statusDiv.innerHTML = "❌ Tu navegador no soporta GPS.";
            if (callback) callback();
            return;
        }

        statusDiv.className = "alert alert-warning";
        statusDiv.innerHTML = "📍 Obteniendo ubicación exacta por GPS...";

        navigator.geolocation.getCurrentPosition(
            function(position) {
                document.getElementById('latitud_origen').value = position.coords.latitude;
                document.getElementById('longitud_origen').value = position.coords.longitude;
                statusDiv.className = "alert alert-success";
                statusDiv.innerHTML = "✅ ¡GPS conectado! Ubicación lista.";
                if (callback) callback();
            },
            function(error) {
                statusDiv.className = "alert alert-danger";
                statusDiv.innerHTML = "⚠️ Activa el GPS de tu teléfono para continuar.";
                btnSolicitar.disabled = false;
                btnSolicitar.innerHTML = "Solicitar Mototaxi";
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    window.addEventListener('DOMContentLoaded', function() {
        obtenerGPS();
    });

    form.addEventListener('submit', function(e) {
        const lat = document.getElementById('latitud_origen').value;
        const lng = document.getElementById('longitud_origen').value;

        if (!lat || !lng) {
            e.preventDefault();
            btnSolicitar.disabled = true;
            btnSolicitar.innerHTML = "Obteniendo GPS...";
            obtenerGPS(function() {
                form.submit();
            });
        }
    });
    </script>
</body>
</html>
