<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Pasajero - Martillos & Ruedas</title>
</head>
<body style="background:#121212; color:#fff; font-family:sans-serif; margin:0; padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; box-sizing:border-box;">
    <div style="background:#1e1e1e; padding:30px; border-radius:10px; border:1px solid #333; width:100%; max-width:480px; box-sizing:border-box; text-align:center;">
        
        <!-- Video Animado (Se reproduce una sola vez al cargar) -->
        <div style="width: 100%; height: 530px; margin: 0 auto 20px auto; overflow: hidden; border-radius: 8px; border: 1px solid #444; background: #1e1e1e; display: flex; justify-content: center; align-items: center;">
            <video autoplay muted playsinline style="width: 100%; height: 100%; object-fit: contain;">
                <source src="{{ url_for('static', filename='intro.mp4') }}" type="video/mp4">
            </video>
        </div>

        <h2 style="color:#2ecc71; margin-top:0; font-size:20px;">Portal de Pasajeros</h2>
        
        <form action="/login_pasajero" method="POST" style="display:flex; flex-direction:column; gap:15px; margin-top:15px; text-align:left;">
            <div>
                <label style="display:block; font-size:12px; color:#aaa; margin-bottom:5px;">Usuario:</label>
                <input type="text" name="usuario" required style="width:100%; padding:10px; background:#2c2c2c; border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            </div>
            <div>
                <label style="display:block; font-size:12px; color:#aaa; margin-bottom:5px;">PIN:</label>
                <input type="password" name="pin" required style="width:100%; padding:10px; background:#2c2c2c; border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            </div>
            <button type="submit" style="padding:11px; background:#2ecc71; border:none; color:#000; font-weight:bold; border-radius:5px; cursor:pointer; font-size:14px; margin-top:5px;">Ingresar</button>
        </form>
        
        <div style="text-align:center; margin-top:20px; display:flex; flex-direction:column; gap:10px;">
            <a href="/registro_pasajero" style="color:#2ecc71; text-decoration:none; font-size:13px;">¿No tienes cuenta? Regístrate aquí</a>
            <a href="/login" style="color:#aaa; text-decoration:none; font-size:12px;">Volver al acceso principal</a>
        </div>
    </div>
</body>
</html>
