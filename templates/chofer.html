<div class="card mb-3">
    <div class="card-body">
        <h5 class="card-title">Nueva Solicitud</h5>
        <p><strong>Destino:</strong> {{ carrera.destino }}</p>
        {% if carrera.referencia %}
            <p><strong>Referencia:</strong> {{ carrera.referencia }}</p>
        {% endif %}

        {% if carrera.lat_origen and carrera.lng_origen %}
            <a href="https://www.google.com/maps/dir/?api=1&destination={{ carrera.lat_origen }},{{ carrera.lng_origen }}" 
               target="_blank" 
               class="btn btn-info w-100 mb-2">
               🗺️ Ver ubicación exacta del pasajero en GPS
            </a>
        {% endif %}

        <a href="/aceptar_carrera/{{ carrera.id }}" class="btn btn-success w-100">Aceptar Carrera</a>
    </div>
</div>
