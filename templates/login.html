<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Operativo - Martillos & Ruedas</title>
</head>
<body style="background:#121212; color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <div style="background:#1e1e1e; padding:35px; border-radius:10px; border:1px solid #333; width:350px; text-align:center;">
        <h3 style="color:#f39c12; margin-top:0;">🔒 Personal Operativo</h3>
        <p style="font-size:12px; color:#aaa; margin-bottom:20px;">PIN de Chofer o Administrador</p>
        <form action="/login" method="POST">
            <input type="password" name="pin" placeholder="Ingresa tu PIN" maxlength="6" required style="width:100%; padding:12px; margin-bottom:15px; background:#2c2c2c; border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box; text-align:center; font-size:16px;">
            <button type="submit" style="width:100%; padding:12px; background:#f39c12; border:none; color:#000; font-weight:bold; border-radius:5px; cursor:pointer; font-size:15px;">Entrar al Sistema</button>
        </form>
    </div>
</body>
</html>
